<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Puppy Tracker">
    <title>Service Puppy Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 80px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .header h1 {
            color: #667eea;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .puppy-info {
            color: #666;
            font-size: 14px;
        }

        .sync-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #666;
            margin-top: 8px;
        }

        .sync-status.synced {
            color: #059669;
        }

        .sync-status.syncing {
            color: #f59e0b;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .section-title {
            color: #667eea;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .checkbox-label:has(input:checked) {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .checkbox-label input {
            width: auto;
            margin: 0;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            margin-top: 10px;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
            margin-top: 10px;
        }

        .location-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 8px;
            font-size: 14px;
            margin-top: 8px;
        }

        .location-status.success {
            background: #d1fae5;
            color: #065f46;
        }

        .location-status.error {
            background: #fee2e2;
            color: #991b1b;
        }

        .entry {
            background: #f9fafb;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .entry-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
        }

        .entry-date {
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .entry-location {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }

        .entry-content {
            font-size: 14px;
            color: #555;
            line-height: 1.5;
        }

        .entry-content strong {
            color: #333;
            display: inline-block;
            min-width: 100px;
        }

        .delete-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            flex: 1;
            padding: 12px;
            background: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }

        .hidden {
            display: none;
        }

        .auth-container {
            max-width: 400px;
            margin: 50px auto;
        }

        .auth-toggle {
            text-align: center;
            margin-top: 15px;
            color: white;
            font-size: 14px;
        }

        .auth-toggle a {
            color: white;
            text-decoration: underline;
            cursor: pointer;
        }

        .user-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 8px;
            font-size: 14px;
            margin-top: 10px;
        }

        .logout-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
        }
    </style>
</head>
<body>
    <div id="loadingScreen" class="loading">
        <h2>Loading...</h2>
    </div>

    <div id="authScreen" class="auth-container hidden">
        <div class="card">
            <div class="section-title">🐕 Service Puppy Tracker</div>
            
            <div id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Password">
                </div>
                <button class="btn btn-primary" onclick="login()">Login</button>
                <div class="auth-toggle">
                    Don't have an account? <a onclick="showSignup()">Sign up</a>
                </div>
            </div>

            <div id="signupForm" class="hidden">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="signupEmail" placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="signupPassword" placeholder="At least 6 characters">
                </div>
                <button class="btn btn-primary" onclick="signup()">Create Account</button>
                <div class="auth-toggle">
                    Already have an account? <a onclick="showLogin()">Login</a>
                </div>
            </div>
        </div>
    </div>

    <div id="appScreen" class="container hidden">
        <div class="header">
            <h1>🐕 Service Puppy Tracker</h1>
            <div class="puppy-info" id="puppyInfo">Configure your puppy's name in Settings</div>
            <div class="sync-status" id="syncStatus">
                <span>●</span> <span id="syncText">Synced</span>
            </div>
            <div class="user-info">
                <span id="userEmail"></span>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('log')">New Entry</button>
            <button class="tab" onclick="switchTab('history')">History</button>
            <button class="tab" onclick="switchTab('settings')">Settings</button>
        </div>

        <!-- Log Entry Tab -->
        <div id="logTab" class="tab-content active">
            <div class="card">
                <div class="section-title">📍 Location</div>
                <button class="btn btn-primary" onclick="captureLocation()">
                    <span>📍 Capture Current Location</span>
                </button>
                <div id="locationStatus" class="location-status hidden"></div>
            </div>

            <div class="card">
                <div class="section-title">📝 Interaction Details</div>
                
                <div class="form-group">
                    <label>Location Type</label>
                    <select id="locationType">
                        <option value="">Select type...</option>
                        <option value="Store">Store/Shopping</option>
                        <option value="Restaurant">Restaurant/Café</option>
                        <option value="Park">Park/Outdoor</option>
                        <option value="Vet">Veterinary Office</option>
                        <option value="Public Transit">Public Transportation</option>
                        <option value="Office">Office/Workplace</option>
                        <option value="Medical">Medical Facility</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Duration (minutes)</label>
                    <input type="number" id="duration" placeholder="e.g., 30">
                </div>

                <div class="form-group">
                    <label>Overall Behavior</label>
                    <select id="behavior">
                        <option value="">Select rating...</option>
                        <option value="Excellent">Excellent</option>
                        <option value="Good">Good</option>
                        <option value="Fair">Fair</option>
                        <option value="Needs Improvement">Needs Improvement</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Distractions Present</label>
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" name="distraction" value="Other dogs"> Other dogs
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="distraction" value="Children"> Children
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="distraction" value="Food"> Food
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="distraction" value="Loud noises"> Loud noises
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="distraction" value="Crowds"> Crowds
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="distraction" value="Other animals"> Other animals
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Commands Practiced</label>
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" name="command" value="Sit"> Sit
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="command" value="Down"> Down
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="command" value="Stay"> Stay
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="command" value="Heel"> Heel
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="command" value="Leave it"> Leave it
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="command" value="Focus"> Focus
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Notes</label>
                    <textarea id="notes" placeholder="Any additional observations, incidents, or achievements..."></textarea>
                </div>

                <button class="btn btn-primary" onclick="saveEntry()">
                    💾 Save Entry
                </button>
            </div>
        </div>

        <!-- History Tab -->
        <div id="historyTab" class="tab-content">
            <div class="stats" id="stats"></div>
            <div class="card">
                <div class="section-title">📚 Training History</div>
                <button class="btn btn-secondary" onclick="exportEntries()">
                    📤 Export All Entries (CSV)
                </button>
                <div id="entriesList"></div>
            </div>
        </div>

        <!-- Settings Tab -->
        <div id="settingsTab" class="tab-content">
            <div class="card">
                <div class="section-title">⚙️ Settings</div>
                
                <div class="form-group">
                    <label>Puppy Name</label>
                    <input type="text" id="puppyName" placeholder="Enter your puppy's name">
                </div>

                <div class="form-group">
                    <label>Handler Name</label>
                    <input type="text" id="handlerName" placeholder="Your name">
                </div>

                <div class="form-group">
                    <label>Training Organization</label>
                    <input type="text" id="organization" placeholder="Organization name">
                </div>

                <button class="btn btn-primary" onclick="saveSettings()">
                    💾 Save Settings
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy, setDoc, getDoc } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyC_ijgRiXBmMVdVen9x6FpPE1p6gX_TrIA",
            authDomain: "puppy-tracker-c630b.firebaseapp.com",
            projectId: "puppy-tracker-c630b",
            storageBucket: "puppy-tracker-c630b.firebasestorage.app",
            messagingSenderId: "608258918042",
            appId: "1:608258918042:web:86c802bbd6df5aae520123",
            measurementId: "G-H84V4PSYDC"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.auth = auth;
        window.db = db;
        window.currentLocation = null;
        window.currentUser = null;

        // Auth state observer
        onAuthStateChanged(auth, (user) => {
            document.getElementById('loadingScreen').classList.add('hidden');
            
            if (user) {
                window.currentUser = user;
                document.getElementById('authScreen').classList.add('hidden');
                document.getElementById('appScreen').classList.remove('hidden');
                document.getElementById('userEmail').textContent = user.email;
                loadUserData();
            } else {
                window.currentUser = null;
                document.getElementById('authScreen').classList.remove('hidden');
                document.getElementById('appScreen').classList.add('hidden');
            }
        });

        window.signup = async function() {
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;

            if (!email || !password) {
                alert('Please enter email and password');
                return;
            }

            if (password.length < 6) {
                alert('Password must be at least 6 characters');
                return;
            }

            try {
                await createUserWithEmailAndPassword(auth, email, password);
                alert('✅ Account created! You are now logged in.');
            } catch (error) {
                alert('Error: ' + error.message);
            }
        };

        window.login = async function() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                alert('Please enter email and password');
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                alert('Error: ' + error.message);
            }
        };

        window.logout = async function() {
            if (confirm('Are you sure you want to logout?')) {
                await signOut(auth);
            }
        };

        window.showSignup = function() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('signupForm').classList.remove('hidden');
        };

        window.showLogin = function() {
            document.getElementById('signupForm').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
        };

        window.loadUserData = async function() {
            await loadSettings();
            await loadEntries();
            updateStats();
        };

        window.saveEntry = async function() {
            const locationType = document.getElementById('locationType').value;
            const duration = document.getElementById('duration').value;
            const behavior = document.getElementById('behavior').value;
            const notes = document.getElementById('notes').value;
            const distractions = getCheckedValues('distraction');
            const commands = getCheckedValues('command');

            if (!window.currentLocation) {
                alert('Please capture your location first');
                return;
            }

            if (!locationType || !behavior) {
                alert('Please fill in Location Type and Overall Behavior');
                return;
            }

            setSyncStatus('syncing');

            const entry = {
                timestamp: new Date().toISOString(),
                location: window.currentLocation,
                locationType,
                duration: duration || null,
                behavior,
                distractions,
                commands,
                notes,
                userId: window.currentUser.uid
            };

            try {
                await addDoc(collection(window.db, 'entries'), entry);
                
                // Reset form
                document.getElementById('locationType').value = '';
                document.getElementById('duration').value = '';
                document.getElementById('behavior').value = '';
                document.getElementById('notes').value = '';
                document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
                
                window.currentLocation = null;
                document.getElementById('locationStatus').classList.add('hidden');

                setSyncStatus('synced');
                alert('✅ Entry saved and synced!');
                switchTab('history');
            } catch (error) {
                setSyncStatus('error');
                alert('Error saving entry: ' + error.message);
            }
        };

        window.loadEntries = async function() {
            const entriesRef = collection(window.db, 'entries');
            const q = query(entriesRef, orderBy('timestamp', 'desc'));
            const querySnapshot = await getDocs(q);
            
            const entries = [];
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                if (data.userId === window.currentUser.uid) {
                    entries.push({ id: doc.id, ...data });
                }
            });

            displayEntries(entries);
            updateStats(entries);
        };

        window.displayEntries = function(entries) {
            const container = document.getElementById('entriesList');

            if (entries.length === 0) {
                container.innerHTML = '<div class="empty-state">No training entries yet. Start by adding your first entry!</div>';
                return;
            }

            container.innerHTML = entries.map(entry => {
                const date = new Date(entry.timestamp);
                const locationStr = entry.location 
                    ? `${entry.location.latitude.toFixed(6)}, ${entry.location.longitude.toFixed(6)}`
                    : 'No location';

                return `
                    <div class="entry">
                        <div class="entry-header">
                            <div>
                                <div class="entry-date">${date.toLocaleDateString()} ${date.toLocaleTimeString()}</div>
                                <div class="entry-location">📍 ${locationStr}</div>
                            </div>
                            <button class="delete-btn" onclick="deleteEntry('${entry.id}')">Delete</button>
                        </div>
                        <div class="entry-content">
                            <div><strong>Type:</strong> ${entry.locationType}</div>
                            ${entry.duration ? `<div><strong>Duration:</strong> ${entry.duration} min</div>` : ''}
                            <div><strong>Behavior:</strong> ${entry.behavior}</div>
                            ${entry.distractions.length > 0 ? `<div><strong>Distractions:</strong> ${entry.distractions.join(', ')}</div>` : ''}
                            ${entry.commands.length > 0 ? `<div><strong>Commands:</strong> ${entry.commands.join(', ')}</div>` : ''}
                            ${entry.notes ? `<div><strong>Notes:</strong> ${entry.notes}</div>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        };

        window.deleteEntry = async function(id) {
            if (!confirm('Delete this entry?')) return;

            setSyncStatus('syncing');
            try {
                await deleteDoc(doc(window.db, 'entries', id));
                setSyncStatus('synced');
                await loadEntries();
            } catch (error) {
                setSyncStatus('error');
                alert('Error deleting entry: ' + error.message);
            }
        };

        window.saveSettings = async function() {
            const settings = {
                puppyName: document.getElementById('puppyName').value,
                handlerName: document.getElementById('handlerName').value,
                organization: document.getElementById('organization').value
            };

            setSyncStatus('syncing');
            try {
                await setDoc(doc(window.db, 'settings', window.currentUser.uid), settings);
                updatePuppyInfo();
                setSyncStatus('synced');
                alert('✅ Settings saved and synced!');
            } catch (error) {
                setSyncStatus('error');
                alert('Error saving settings: ' + error.message);
            }
        };

        window.loadSettings = async function() {
            try {
                const docRef = doc(window.db, 'settings', window.currentUser.uid);
                const docSnap = await getDoc(docRef);
                
                if (docSnap.exists()) {
                    const settings = docSnap.data();
                    document.getElementById('puppyName').value = settings.puppyName || '';
                    document.getElementById('handlerName').value = settings.handlerName || '';
                    document.getElementById('organization').value = settings.organization || '';
                    updatePuppyInfo();
                }
            } catch (error) {
                console.error('Error loading settings:', error);
            }
        };

        window.updatePuppyInfo = function() {
            const puppyName = document.getElementById('puppyName').value;
            const organization = document.getElementById('organization').value;
            const info = document.getElementById('puppyInfo');
            
            if (puppyName) {
                info.textContent = `Training ${puppyName}${organization ? ' • ' + organization : ''}`;
            } else {
                info.textContent = 'Configure your puppy\'s name in Settings';
            }
        };

        window.exportEntries = async function() {
            const entriesRef = collection(window.db, 'entries');
            const q = query(entriesRef, orderBy('timestamp', 'desc'));
            const querySnapshot = await getDocs(q);
            
            const entries = [];
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                if (data.userId === window.currentUser.uid) {
                    entries.push(data);
                }
            });

            if (entries.length === 0) {
                alert('No entries to export');
                return;
            }

            const settingsRef = doc(window.db, 'settings', window.currentUser.uid);
            const settingsSnap = await getDoc(settingsRef);
            const settings = settingsSnap.exists() ? settingsSnap.data() : {};

            const headers = ['Date', 'Time', 'Puppy Name', 'Handler', 'Location Type', 'Duration (min)', 
                            'Behavior', 'Distractions', 'Commands Practiced', 'Latitude', 'Longitude', 
                            'Location Accuracy (m)', 'Notes'];
            
            const rows = entries.map(entry => {
                const date = new Date(entry.timestamp);
                return [
                    date.toLocaleDateString(),
                    date.toLocaleTimeString(),
                    settings.puppyName || '',
                    settings.handlerName || '',
                    entry.locationType,
                    entry.duration || '',
                    entry.behavior,
                    entry.distractions.join('; '),
                    entry.commands.join('; '),
                    entry.location ? entry.location.latitude : '',
                    entry.location ? entry.location.longitude : '',
                    entry.location ? Math.round(entry.location.accuracy) : '',
                    entry.notes || ''
                ].map(field => `"${String(field).replace(/"/g, '""')}"`).join(',');
            });

            const csv = [headers.join(','), ...rows].join('\n');
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `service-puppy-training-${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        };

        window.updateStats = function(entries) {
            if (!entries) return;
            
            const statsContainer = document.getElementById('stats');
            const totalMinutes = entries.reduce((sum, e) => sum + (parseInt(e.duration) || 0), 0);

            statsContainer.innerHTML = `
                <div class="stat-card">
                    <div class="stat-value">${entries.length}</div>
                    <div class="stat-label">Total Sessions</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${Math.round(totalMinutes / 60)}h</div>
                    <div class="stat-label">Training Time</div>
                </div>
            `;
        };

        window.setSyncStatus = function(status) {
            const statusEl = document.getElementById('syncStatus');
            const textEl = document.getElementById('syncText');
            
            statusEl.className = 'sync-status';
            
            if (status === 'synced') {
                statusEl.classList.add('synced');
                textEl.textContent = 'Synced';
            } else if (status === 'syncing') {
                statusEl.classList.add('syncing');
                textEl.textContent = 'Syncing...';
            } else {
                textEl.textContent = 'Sync error';
            }
        };
    </script>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');

            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(tab + 'Tab').classList.add('active');

            if (tab === 'history') {
                window.loadEntries();
            }
        }

        function captureLocation() {
            const statusEl = document.getElementById('locationStatus');
            statusEl.classList.remove('hidden', 'success', 'error');
            statusEl.innerHTML = '📍 Getting your location...';

            if (!navigator.geolocation) {
                statusEl.classList.add('error');
                statusEl.innerHTML = '❌ Geolocation not supported';
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    window.currentLocation = {
                        latitude: position.coords.latitude,
                        longitude: position.coords.longitude,
                        accuracy: position.coords.accuracy,
                        timestamp: new Date().toISOString()
                    };
                    statusEl.classList.add('success');
                    statusEl.innerHTML = `✅ Location captured (±${Math.round(window.currentLocation.accuracy)}m accuracy)`;
                },
                function(error) {
                    statusEl.classList.add('error');
                    let message = '❌ ';
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            message += 'Location permission denied. Enable in Settings > Safari > Location';
                            break;
                        case error.POSITION_UNAVAILABLE:
                            message += 'Location unavailable';
                            break;
                        case error.TIMEOUT:
                            message += 'Location request timed out';
                            break;
                        default:
                            message += 'Error getting location';
                    }
                    statusEl.innerHTML = message;
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        function getCheckedValues(name) {
            return Array.from(document.querySelectorAll(`input[name="${name}"]:checked`))
                .map(cb => cb.value);
        }
    </script>
</body>
</html>
