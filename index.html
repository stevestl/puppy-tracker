<script>
    let currentLocation = null;

    // Initialize
    document.addEventListener('DOMContentLoaded', function() {
        loadSettings();
        displayEntries();
        updateStats();
    });

    function switchTab(tab) {
        // Update tab buttons
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');

        // Update tab content
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.getElementById(tab + 'Tab').classList.add('active');

        if (tab === 'history') {
            displayEntries();
            updateStats();
        }
    }

    function captureLocation() {
        const statusEl = document.getElementById('locationStatus');
        statusEl.classList.remove('hidden', 'success', 'error');
        statusEl.innerHTML = '📍 Getting your location...';

        if (!navigator.geolocation) {
            statusEl.classList.add('error');
            statusEl.innerHTML = '❌ Geolocation not supported';
            return;
        }

        navigator.geolocation.getCurrentPosition(
            function(position) {
                currentLocation = {
                    latitude: position.coords.latitude,
                    longitude: position.coords.longitude,
                    accuracy: position.coords.accuracy,
                    timestamp: new Date().toISOString()
                };
                statusEl.classList.add('success');
                statusEl.innerHTML = `✅ Location captured (±${Math.round(currentLocation.accuracy)}m accuracy)`;
            },
            function(error) {
                statusEl.classList.add('error');
                let message = '❌ ';
                switch(error.code) {
                    case error.PERMISSION_DENIED:
                        message += 'Location permission denied. Enable in Settings > Safari > Location';
                        break;
                    case error.POSITION_UNAVAILABLE:
                        message += 'Location unavailable';
                        break;
                    case error.TIMEOUT:
                        message += 'Location request timed out';
                        break;
                    default:
                        message += 'Error getting location';
                }
                statusEl.innerHTML = message;
            },
            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            }
        );
    }

    function getCheckedValues(name) {
        return Array.from(document.querySelectorAll(`input[name="${name}"]:checked`))
            .map(cb => cb.value);
    }

    function saveEntry() {
        const locationType = document.getElementById('locationType').value;
        const duration = document.getElementById('duration').value;
        const behavior = document.getElementById('behavior').value;
        const notes = document.getElementById('notes').value;
        const distractions = getCheckedValues('distraction');
        const commands = getCheckedValues('command');

        if (!currentLocation) {
            alert('Please capture your location first');
            return;
        }

        if (!locationType || !behavior) {
            alert('Please fill in Location Type and Overall Behavior');
            return;
        }

        const entry = {
            id: Date.now(),
            timestamp: new Date().toISOString(),
            location: currentLocation,
            locationType,
            duration: duration || null,
            behavior,
            distractions,
            commands,
            notes
        };

        // Get existing entries
        const entries = JSON.parse(localStorage.getItem('trainingEntries') || '[]');
        entries.unshift(entry);
        localStorage.setItem('trainingEntries', JSON.stringify(entries));

        // Reset form
        document.getElementById('locationType').value = '';
        document.getElementById('duration').value = '';
        document.getElementById('behavior').value = '';
        document.getElementById('notes').value = '';
        document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
        document.querySelectorAll('.checkbox-label').forEach(label => {
            label.style.background = '';
            label.style.color = '';
            label.style.borderColor = '';
        });
        
        currentLocation = null;
        document.getElementById('locationStatus').classList.add('hidden');

        alert('✅ Entry saved successfully!');
        switchTab('history');
    }

    function displayEntries() {
        const entries = JSON.parse(localStorage.getItem('trainingEntries') || '[]');
        const container = document.getElementById('entriesList');

        if (entries.length === 0) {
            container.innerHTML = '<div class="empty-state">No training entries yet. Start by adding your first entry!</div>';
            return;
        }

        container.innerHTML = entries.map(entry => {
            const date = new Date(entry.timestamp);
            const locationStr = entry.location 
                ? `${entry.location.latitude.toFixed(6)}, ${entry.location.longitude.toFixed(6)}`
                : 'No location';

            return `
                <div class="entry">
                    <div class="entry-header">
                        <div>
                            <div class="entry-date">${date.toLocaleDateString()} ${date.toLocaleTimeString()}</div>
                            <div class="entry-location">📍 ${locationStr}</div>
                        </div>
                        <button class="delete-btn" onclick="deleteEntry(${entry.id})">Delete</button>
                    </div>
                    <div class="entry-content">
                        <div><strong>Type:</strong> ${entry.locationType}</div>
                        ${entry.duration ? `<div><strong>Duration:</strong> ${entry.duration} min</div>` : ''}
                        <div><strong>Behavior:</strong> ${entry.behavior}</div>
                        ${entry.distractions.length > 0 ? `<div><strong>Distractions:</strong> ${entry.distractions.join(', ')}</div>` : ''}
                        ${entry.commands.length > 0 ? `<div><strong>Commands:</strong> ${entry.commands.join(', ')}</div>` : ''}
                        ${entry.notes ? `<div><strong>Notes:</strong> ${entry.notes}</div>` : ''}
                    </div>
                </div>
            `;
        }).join('');
    }

    function deleteEntry(id) {
        if (!confirm('Delete this entry?')) return;

        let entries = JSON.parse(localStorage.getItem('trainingEntries') || '[]');
        entries = entries.filter(e => e.id !== id);
        localStorage.setItem('trainingEntries', JSON.stringify(entries));
        displayEntries();
        updateStats();
    }

    function updateStats() {
        const entries = JSON.parse(localStorage.getItem('trainingEntries') || '[]');
        const statsContainer = document.getElementById('stats');

        const totalMinutes = entries.reduce((sum, e) => sum + (parseInt(e.duration) || 0), 0);
        const excellentCount = entries.filter(e => e.behavior === 'Excellent').length;

        statsContainer.innerHTML = `
            <div class="stat-card">
                <div class="stat-value">${entries.length}</div>
                <div class="stat-label">Total Sessions</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">${Math.round(totalMinutes / 60)}h</div>
                <div class="stat-label">Training Time</div>
            </div>
        `;
    }

    function exportEntries() {
        const entries = JSON.parse(localStorage.getItem('trainingEntries') || '[]');
        const settings = JSON.parse(localStorage.getItem('puppySettings') || '{}');

        if (entries.length === 0) {
            alert('No entries to export');
            return;
        }

        // Create CSV
        const headers = ['Date', 'Time', 'Puppy Name', 'Handler', 'Location Type', 'Duration (min)', 
                        'Behavior', 'Distractions', 'Commands Practiced', 'Latitude', 'Longitude', 
                        'Location Accuracy (m)', 'Notes'];
        
        const rows = entries.map(entry => {
            const date = new Date(entry.timestamp);
            return [
                date.toLocaleDateString(),
                date.toLocaleTimeString(),
                settings.puppyName || '',
                settings.handlerName || '',
                entry.locationType,
                entry.duration || '',
                entry.behavior,
                entry.distractions.join('; '),
                entry.commands.join('; '),
                entry.location ? entry.location.latitude : '',
                entry.location ? entry.location.longitude : '',
                entry.location ? Math.round(entry.location.accuracy) : '',
                entry.notes || ''
            ].map(field => `"${String(field).replace(/"/g, '""')}"`).join(',');
        });

        const csv = [headers.join(','), ...rows].join('\n');
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `service-puppy-training-${new Date().toISOString().split('T')[0]}.csv`;
        a.click();
        URL.revokeObjectURL(url);
    }

    function saveSettings() {
        const settings = {
            puppyName: document.getElementById('puppyName').value,
            handlerName: document.getElementById('handlerName').value,
            organization: document.getElementById('organization').value
        };

        localStorage.setItem('puppySettings', JSON.stringify(settings));
        updatePuppyInfo();
        alert('✅ Settings saved!');
    }

    function loadSettings() {
        const settings = JSON.parse(localStorage.getItem('puppySettings') || '{}');
        document.getElementById('puppyName').value = settings.puppyName || '';
        document.getElementById('handlerName').value = settings.handlerName || '';
        document.getElementById('organization').value = settings.organization || '';
        updatePuppyInfo();
    }

    function updatePuppyInfo() {
        const settings = JSON.parse(localStorage.getItem('puppySettings') || '{}');
        const info = document.getElementById('puppyInfo');
        if (settings.puppyName) {
            info.textContent = `Training ${settings.puppyName}${settings.organization ? ' • ' + settings.organization : ''}`;
        } else {
            info.textContent = 'Configure your puppy\'s name in Settings';
        }
    }

    function clearAllData() {
        if (!confirm('⚠️ This will delete ALL training entries and settings. Are you sure?')) return;
        if (!confirm('This cannot be undone. Continue?')) return;

        localStorage.removeItem('trainingEntries');
        localStorage.removeItem('puppySettings');
        location.reload();
    }
</script>
